name: Business Central PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

concurrency:
  group: al-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      report: ${{ steps.review.outputs.report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          path: candidate
          persist-credentials: false
      - name: Verify isolated merge snapshot
        shell: bash
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git -C candidate rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - name: Review AL without executing PR scripts
        id: review
        shell: bash
        run: |
          node --test trusted/.github/scripts/al-review.test.mjs trusted/.github/scripts/publish-review.test.cjs
          node trusted/.github/scripts/al-review.mjs --base "$GITHUB_WORKSPACE/trusted" --head "$GITHUB_WORKSPACE/candidate" --output "$RUNNER_TEMP/al-review.json"
          node -e 'const fs=require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "report="+fs.readFileSync(process.env.RUNNER_TEMP+"/al-review.json").toString("base64")+"\n")'

  compile:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report: ${{ steps.compile.outputs.report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          path: candidate
          persist-credentials: false
      - name: Verify isolated merge snapshot
        shell: pwsh
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $base = git -C candidate rev-parse HEAD^1
          if ($LASTEXITCODE -ne 0 -or $base -ne $env:EXPECTED_BASE) { throw 'Stale merge base' }
          $head = git -C candidate rev-parse HEAD^2
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:EXPECTED_HEAD) { throw 'Stale PR head' }
      - name: Compile and run AL analyzers
        id: compile
        shell: pwsh
        env:
          AL_SYMBOLS_URL: ${{ vars.AL_REVIEW_SYMBOLS_URL }}
          AL_SYMBOLS_SHA256: ${{ vars.AL_REVIEW_SYMBOLS_SHA256 }}
          AL_DISTRIBUTION: ${{ vars.AL_REVIEW_DISTRIBUTION }}
        run: |
          & "$env:GITHUB_WORKSPACE/trusted/.github/scripts/compile-al.ps1" -Project "$env:GITHUB_WORKSPACE/candidate"

  publish:
    needs: [static, compile]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
      models: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Update review and notification
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          STATIC_REPORT: ${{ needs.static.outputs.report }}
          COMPILE_REPORT: ${{ needs.compile.outputs.report }}
          AI_ENABLED: ${{ vars.AL_REVIEW_AI_ENABLED }}
          AI_MODEL: ${{ vars.AL_REVIEW_AI_MODEL }}
          MODELS_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ vars.AL_REVIEW_NOTIFY_USER }}
        with:
          script: |
            const publish = require(process.env.GITHUB_WORKSPACE + '/trusted/.github/scripts/publish-review.cjs');
            await publish({github, context, core});
